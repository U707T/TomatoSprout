name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Install SDK components (compileSdk 37)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)
          if [ -n "${SDKMANAGER:-}" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" \
              || echo "::warning::sdkmanager 暂时列不到 android-37，交给 AGP 自动下载"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${KEYSTORE_B64:-}" ] || { echo "::error::缺少 KEYSTORE secret"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore.jks
          keytool -list -keystore keystore.jks -storepass "$STORE_PASSWORD" > /dev/null
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
          chmod 600 key.properties keystore.jks

      - uses: gradle/actions/setup-gradle@v4

      - name: Domain unit tests
        run: ./gradlew :core:domain:test --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug + signed release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/TomatoSprout-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/TomatoSprout-release.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: TomatoSprout-apks
          path: out/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TomatoSprout-apks
          path: apks

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^ *versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)
          [ -n "$VERSION" ] || { echo "::error::无法解析 versionName"; exit 1; }
          TAG="v$VERSION"
          # 只取 CHANGELOG 最上面一节做发布说明，别把整个版本历史塞进 Release
          awk '/^## /{c++} c==2{exit} c==1{print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then cp CHANGELOG.md RELEASE_NOTES.md; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" apks/*.apk --clobber
          else
            gh release create "$TAG" apks/*.apk --title "番茄芽 $TAG" --notes-file RELEASE_NOTES.md
          fi
